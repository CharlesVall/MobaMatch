version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mobamatch-db
    environment:
      POSTGRES_DB: mobamatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

